<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Editor Markdown Básico</title>
    <link rel="stylesheet" href="css/main.css" />
</head>

<body>

    <!-- PANEL IZQUIERDO -->
    <div id="leftPanel">
        <h2>Editor Markdown</h2>
        <div class="app-version">v1.3.82</div>

        <div class="user-accordion">
            <button class="accordion-toggle" id="userAccordionToggle" type="button" aria-expanded="false">
                <span class="accordion-title">USUARIO</span>
                <span class="user-summary">
                    <span id="userStatusDot" class="status-dot" aria-hidden="true"></span>
                    <span id="userNameLabel">Sin sesión</span>
                </span>
            </button>
            <div class="accordion-panel" id="userAccordionPanel" aria-hidden="true">
                <p id="userNoSessionMessage" class="auth-muted">
                    Inicia sesión para ver y editar la información del usuario.
                </p>
                <form id="userEditForm" class="user-edit-form">
                    <label>
                        Usuario
                        <input type="text" id="userEditName" autocomplete="off" />
                    </label>
                    <label>
                        Nueva contraseña
                        <input type="password" id="userEditPass" autocomplete="new-password" />
                    </label>
                    <p id="userEditStatus" class="status-message" role="status" aria-live="polite"></p>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>
            </div>
        </div>

        <button class="btn" id="btnCopiar">📋 Copiar Markdown</button>
        <button class="btn" id="btnDescargar">⬇️ Descargar .md</button>
        <button class="btn" id="btnExportProyecto">🧾 Exportar JSON</button>
        <button class="btn" id="btnImportProyecto">📂 Importar JSON</button>
        <button class="btn" id="btnGuardarProyecto">💾 Guardar proyecto</button>
        <button class="btn" id="btnCargarProyecto">📂 Cargar proyecto</button>
        <button class="btn" id="btnVincularProcess">🔗 Vincular proyecto process</button>
        <button class="btn" id="btnSincronizarCode">📤 Enviar plantillas a Flow</button>
        <button class="btn" id="btnValidarTesauros">✅ Validar tesauros configurados <span class="btn-help-icon" aria-label="Información" title="Permite copiar y pegar los tesauros configurados en Gestiona para validar si existen o no y hacer coincidir los valores de tesauros selector">?</span></button>
        <hr>
    </div>

    <div id="loginModal" class="modal-overlay login-modal" aria-hidden="true">
        <div class="modal-card login-modal-card" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
            <div class="modal-header">
                <h3 id="loginModalTitle">Iniciar sesión</h3>
            </div>
            <form id="loginForm" class="modal-body login-modal-body">
                <label>
                    Usuario
                    <input type="text" id="loginUserInput" autocomplete="username" required />
                </label>
                <label>
                    Contraseña
                    <input type="password" id="loginPassInput" autocomplete="current-password" required />
                </label>
                <p id="loginStatus" class="status-message" role="status" aria-live="polite"></p>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ZONA CENTRAL -->
    <div id="mainArea">

        <div class="project-name-bar">
            <label for="projectNameInput">Nombre del proyecto</label>
            <input id="projectNameInput" type="text" placeholder="Escribe el nombre del proyecto" />
        </div>

        <div class="template-name-bar">
            <div class="template-name-field">
                <label for="templateNameInput">Nombre de la plantilla activa</label>
                <input id="templateNameInput" type="text" placeholder="Escribe el nombre de la plantilla" />
            </div>
            <div class="template-type-field">
                <label for="templateTypeSelect">Tipo</label>
                <select id="templateTypeSelect">
                    <option value="Formulario">Formulario</option>
                    <option value="Documento">Documento</option>
                    <option value="Circuito de Resolución">Circuito de Resolución</option>
                </select>
            </div>
        </div>

        <!-- TOOLBAR SUPERIOR -->
        <div id="toolbar" class="toolbar">
            <button data-md="bold"><b>B</b></button>
            <button data-md="italic"><i>I</i></button>
            <button data-md="underline"><u>U</u></button>

            <span class="separator"></span>

            <button data-md="h1">H1</button>
            <button data-md="h2">H2</button>

            <span class="separator"></span>

            <button data-md="ul">• Lista</button>
            <button data-md="ol">1. Lista</button>

            <span class="separator"></span>

            <button data-md="quote">❝</button>
            <button data-md="code">{ }</button>

            <span class="separator"></span>
            <button data-md="table">📊 Tabla</button>
            <button data-md="columns">🧱 Doble columna</button>
            <button data-md="columnsMulti">🧱 Doble columna multipárrafo</button>
            <button id="toggleMiniMap" type="button" aria-pressed="false">🗺️ Miniatura</button>
        </div>

        <!-- SOLO EDITOR MARKDOWN -->
        <div id="workContainer">
            <div id="lineNumbers" aria-hidden="true"></div>
            <textarea id="markdownText" spellcheck="false"></textarea>
        </div>

    </div>

    <script src="js/core/auth.js"></script>
    <script src="js/core/editormarkdown.js"></script>
    <script src="js/features/sections.js"></script>
    <script src="js/features/let.js"></script>
    <script src="js/features/definition.js"></script>
    <script src="js/features/tables.js"></script>
    <!-- === TESAURO: integración panel y gestor completo === -->
    <script src="js/tesauro/datatesauro_md.js"></script>
    <script src="js/tesauro/tesauromanager_md.js"></script>
    <!-- === FIN TESAURO === -->

    <button id="guideTrigger" class="guide-trigger" type="button">GUÍA</button>
    <script src="js/core/guide.js"></script>

</body>
</html>
